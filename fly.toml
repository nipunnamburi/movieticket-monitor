# fly.toml — Fly.io deployment config for BookMyShow Monitor API + Worker
# Deploy with: fly deploy
# Free tier: 3 shared VMs, no credit card required

app = "bms-monitor-api"
primary_region = "sin"  # Singapore — closest to India

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false   # Keep always-on (critical for BullMQ worker)
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.health]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    port = 8080
    timeout = "10s"
    type = "http"
