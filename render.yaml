services:
  - type: web
    name: bms-monitor-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free

    # Health check — Render uses this to confirm the app started
    healthCheckPath: /api/health

    # Environment variables — set these in the Render dashboard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: DEFAULT_EMAIL_TO
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
