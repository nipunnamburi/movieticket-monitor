name: BMS 24/7 Ticket Notifier

on:
  schedule:
    # Run check every 5 minutes 24/7 in GitHub Actions cloud
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      monitor_url:
        description: "BookMyShow Movie or Buytickets URL"
        required: false
        default: "https://in.bookmyshow.com/movies/hyderabad/vibe/ET00506465"
      force_alert:
        description: "Force alert if tickets are bookable"
        required: false
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      DEFAULT_EMAIL_TO: ${{ secrets.DEFAULT_EMAIL_TO }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
      MONITOR_URL: ${{ github.event.inputs.monitor_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium & System Dependencies
        run: |
          playwright install chromium --with-deps

      - name: Run BMS Notifier Cycle
        run: |
          CMD="python main.py"
          if [ -n "${{ github.event.inputs.monitor_url }}" ]; then
            CMD="$CMD --url '${{ github.event.inputs.monitor_url }}'"
          fi
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            CMD="$CMD --force-alert"
          fi
          eval $CMD

      - name: Commit and Push Updated State Snapshot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bms_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update bms_state.json snapshot [skip ci]" && git push)
        continue-on-error: true
